# Production - STATIC DATA + H2 (no MySQL needed)
spring.application.name=aiSeduction
server.port=8080

# Use H2 In-Memory DB (no external MySQL)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Static first user (auto-created)
spring.jpa.defer-datasource-initialization=true

# TikTok OAuth (Render ENV vars override)
tiktok.client-id=${TIKTOK_CLIENT_ID:sbawcpylm5rplz9cos}
tiktok.client-secret=${TIKTOK_CLIENT_SECRET:fYUWfEY2g1IMXdeS7A2bjwJPzkZTlsR4}
tiktok.redirect-uri=${TIKTOK_REDIRECT_URI:https://tiktok-backend-franckizar.onrender.com/auth/tiktok/callback}
tiktok.authorization-url=https://www.tiktok.com/v2/auth/authorize/
tiktok.token-url=https://open.tiktokapis.com/v2/oauth/token/
tiktok.user-info-url=https://open.tiktokapis.com/v2/user/info/

# JWT
jwt.secret=${JWT_SECRET:your64charSecretKeyHereMakeItLongAndRandom1234567890abcdef}
jwt.expiration=86400000

# Frontend URL
frontend.url=${FRONTEND_URL:https://your-nextjs.vercel.app}
